# https://mise.jdx.dev/configuration.html
#
# Copy to .mise.local.toml and edit with actual secrets. What each one does:
# docs/external-services.md.

[env]
# Required: config/runtime.exs reads it in every environment.
MAPBOX_ACCESS_TOKEN = "pk.e---"
# Where the D4H refresh saves team logos.
TEAM_LOGO_PATH = "/Users/gerry/Developer/sarduty.mount/team-logos"
# Optional: send real mail from dev instead of /dev/mailbox. Set both.
# CLOUDFLARE_ACCOUNT_ID = ""
# CLOUDFLARE_EMAIL_TOKEN = ""
# Optional: pinged after each successful team refresh.
# HEALTHCHECKS_URL = ""
# Optional: sign Apple Wallet passes for member ID cards. PEM text. Set all four.
# APPLE_PASS_TYPE_ID = "pass.com.sarduty.member-card"
# APPLE_TEAM_ID = ""
# APPLE_PASS_CERTIFICATE = """-----BEGIN CERTIFICATE-----..."""
# APPLE_PASS_PRIVATE_KEY = """-----BEGIN PRIVATE KEY-----..."""

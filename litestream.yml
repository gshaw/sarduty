# Litestream expands ${VAR} from the environment; all three are Fly secrets.
dbs:
  - path: /mnt/sarduty/sarduty.db
    replica:
      type: s3
      bucket: sarduty-db
      path: database
      endpoint: https://${CLOUDFLARE_ACCOUNT_ID}.r2.cloudflarestorage.com
      region: auto
      access-key-id: ${R2_ACCESS_KEY_ID}
      secret-access-key: ${R2_SECRET_ACCESS_KEY}

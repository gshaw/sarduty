# Litestream expands ${VAR} from the environment: DATABASE_PATH from fly.toml, the
# rest Fly secrets.
# Metrics on :9090 for Fly to scrape ([metrics] in fly.toml), so checkpoint times show in
# Fly's Grafana and its metrics API (#416).
addr: ":9090"

dbs:
  - path: ${DATABASE_PATH}
    replica:
      type: s3
      bucket: sarduty-db
      path: database
      endpoint: https://${CLOUDFLARE_ACCOUNT_ID}.r2.cloudflarestorage.com
      region: auto
      access-key-id: ${R2_ACCESS_KEY_ID}
      secret-access-key: ${R2_SECRET_ACCESS_KEY}

# Litestream expands ${VAR} from the environment: DATABASE_PATH from fly.toml, the
# rest Fly secrets.
# Metrics on :9090 for Fly to scrape ([metrics] in fly.toml), so checkpoint times show in
# Fly's Grafana and its metrics API (#416).
addr: ":9090"

# Fewer R2 lists (#810). The L0 retention check lists L1 and L0 each time it runs; at its
# 15 s default that was most of R2's Class A operations. Syncs stay every second. A
# levels list replaces the defaults (30s, 5m, 1h), so all three are here.
l0-retention-check-interval: 5m
levels:
  - interval: 5m
  - interval: 15m
  - interval: 1h

dbs:
  - path: ${DATABASE_PATH}
    replica:
      type: s3
      bucket: sarduty-db
      path: database
      endpoint: https://${CLOUDFLARE_ACCOUNT_ID}.r2.cloudflarestorage.com
      region: auto
      access-key-id: ${R2_ACCESS_KEY_ID}
      secret-access-key: ${R2_SECRET_ACCESS_KEY}

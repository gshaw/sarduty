# https://mise.jdx.dev/configuration.html

[settings]
# mise's version service doesn't list stet, so the pin can't install without this.
use_versions_host = false

[tools]
age = "1.3.2"
elixir = "1.20.4-otp-29"
erlang = "29.1.2"
"github:gshaw/stet" = "0.2.1"
hk = "2.12.0"
oxipng = "10.2.1"
typst = "0.15.1"

# Every `mise install` also fetches the Mix deps, so a fresh checkout compiles; from
# ~/.hex, about a second. Skipped in CI, where it would run before the deps cache is
# restored and before Hex is installed; the workflow's own `mix deps.get` covers it.
[hooks]
postinstall = '[ -n "$CI" ] || mix deps.get >/dev/null'

# Everything except the test suite. hk formats and lints (Markdown and spelling
# through stet, Elixir with mix format and Credo), then the Mix steps that need
# the whole project. What to run before committing.
[tasks.check]
description = "Format, lint, spell check, and compile"
run = [
  "hk fix --all",
  "mix compile --force --warnings-as-errors",
  "mix deps.unlock --unused",
]

# What the pre-commit hook checks, on every file and without changing any.
[tasks.lint]
run = "hk check --all"

[tasks.format]
run = "mix format"

[tasks.compile]
run = "mix compile --force --warnings-as-errors"

[tasks.test]
# Warnings in test files fail too, as `check` does for lib/.
run = "mix test --color --warnings-as-errors"

[tasks.ci]
description = "Run all checks, then the test suite"
run = [{ task = "check" }, { task = "test" }]

# By hand, never in CI: `mix test` only replays the seeds and saved failures. See
# docs/testing-strategy.md, Fuzz tests. MINUTES sets each test's time (default 5).
[tasks.fuzz]
description = "Fuzz the report language, a few minutes per test"
env = { MIX_ENV = "test" }
run = """
ms=$(( ${MINUTES:-5} * 60000 ))
mix fuzz 'test/app/report/parser_fuzz_test.exs:fuzz any text parses or gives a report error' --max-time $ms
mix fuzz 'test/app/report/report_words_fuzz_test.exs:fuzz built-in reports with words swapped run or give a report error' --max-time $ms
"""

# CI only checks and never changes the tree, so a CI run fails loudly instead of
# reformatting. `mise run -c ci-static-analysis` locally runs every check even
# after one fails.
[tasks.ci-static-analysis]
depends = ["ci-elixir", "ci-stet"]

[tasks.ci-elixir]
run = [
  "mix format --check-formatted",
  "mix compile --force --warnings-as-errors",
  "mix deps.unlock --check-unused",
  "mix credo --strict",
]

[tasks.ci-stet]
description = "Check Markdown and spelling across the whole repo"
run = "stet check --check-only"

[tasks.server]
run = "mix phx.server"

[tasks.deploy]
description = "Deploy origin/main to Fly, holding the shared deploy lock"
usage = """
flag "-v --verbose" help="Stream Fly's own output under each step"
flag "--wait" help="Wait for another deploy's lock instead of stopping"
flag "--force" help="Deploy even when production already runs origin/main"
flag "--dry-run" help="Show what would ship, then stop before Fly builds anything"
"""
run = "bin/deploy"

[tasks.vacuum]
run = "sqlite3 db/sarduty_dev.db \"VACUUM;\""

[tasks.sanitize]
description = "Load a production backup into the dev database with personal data replaced"
run = "MAPBOX_ACCESS_TOKEN=${MAPBOX_ACCESS_TOKEN:-dummy} mix run --no-start backups/sanitize.exs"

---
$schema: "https://raw.githubusercontent.com/streetsidesoftware/cspell/main/cspell.schema.json"
version: "0.2"
# en-GB accepts the Canadian spellings the UI uses (colour, centre); cspell has no en-CA
# dictionary. Code keeps US spelling by convention (docs/writing.md), which cspell can't check.
language: en,en-GB
allowCompoundWords: true
# What git ignores is built or scratch: deps, mockup rounds, dumped pages.
useGitignore: true
ignorePaths:
  - ".claude"
  - "_build/*"
  - ".git/*"
  - "assets/vendor/*"
  - "cspell.config.yml"
  - "deps/*"
  - "erl_crash.dump"
  - "priv/fonts/*" # Arimo and its licence, as published
  - "priv/static/assets/*"
  - "priv/static/images/add-to-apple-wallet.svg" # Apple's badge, as published: its rules forbid editing it (#952)
words:
  - typst # makes tax credit letters as PDFs (#918)
  - Arimo # the letters' font, Helvetica's widths (#918)
  - wght # a variable font's weight axis, in DancingScript[wght].ttf, the letters' signature (#995)
  - mult # Decimal.mult, the decimal library's multiply: a form's money and Service.Format.money (#950)
  - EMCR # Emergency Management and Climate Readiness, BC's agency, whose forms teams fill (#950)
  - IHDR # a PNG's header chunk, which holds its size
  - silverbasin # Silver Basin SAR's subdomain, a made-up team (App.SilverBasin, #963)
  - WESARA # Western Search and Rescue Association, the made-up organization (#963)
  - SBSAR # Silver Basin SAR's abbreviated name (#963)
  - webauthn # the browser API passkeys use, and its autocomplete token (#129)
  - aaguid # the id of the authenticator that made a passkey, which names it (#129)
  - CBOR # the binary format WebAuthn's attestation objects use (#129)
  - COSE # the key format WebAuthn's public keys use (#129)
  # The made-up cast's names that aren't plain English (#963)
  - Lefèvre
  - Łukasz
  - Wójcik
  - Trần
  - Minh
  - Châu
  - Siobhán
  - Moreau
  - nohup
  - SAMP # the prefix of Coast Range SAR's sample ID card codes (#854)
  - SAMPX # the first half of a sample ID card code, SAMPX-ACTVX (#969)
  - ACTVX # sample card code SAMPX-ACTVX, the active member (#854)
  - RTRDX # sample card code SAMPX-RTRDX, the retired member (#854)
  - CNCDX # sample card code SAMPX-CNCDX, the cancelled card (#854)
  - NCRDX # sample card code SAMPX-NCRDX, no card (#854)
  - SAMPXACTVX # the codes as stored, without the dash
  - SAMPXRTRDX
  - SAMPXCNCDX
  - SAMPXNCRDX
  - PKCE # OAuth's proof key for code exchange (RFC 7636), in agent connections (#761)
  - oxipng # the lossless PNG optimizer the mockup kit runs, pinned in .mise.toml
  - noindex # X-Robots-Tag's value, and the router pipeline that sends it (#824)
  - llms # /llms.txt, the file agents look for (#824)
  - Lucide # the icon set, copied into assets/icons; its name heads each icon file
  - mdex # the Hex package name of MDEx, the Markdown renderer, in mix.exs and config.exs
  - Exqlite # the SQLite driver Ecto uses; its error struct is matched in App.Repo.SlowLog and its test
  - PSLV # BC's provincial SAR volunteer registration, a real qualification in group rule tests
  - GSTL # Ground Search Team Leader, a real BC qualification in group rule tests
  - UNRETIRE # D4H's retire endpoint's direction, in the adapter and its tests
  - eqrcode # the Hex package that encodes the QR code on tax credit letters
  - zxing # zxing-wasm, the vendored barcode reader for equipment, in its JS and docs
  - trix # Trix, 37signals' rich text editor, vendored for activity descriptions (#599)
  - VCALENDAR # iCalendar's (RFC 5545) wrapper, in Service.Calendar and its test
  - VEVENT # iCalendar's event block, in Service.Calendar and its test
  - DTEND # iCalendar's end time, in Service.Calendar and its test
  - ntoa # Erlang's :inet.ntoa/1, an IP tuple to a string
  - YSSR # York Sunbury SAR's abbreviated name, the example in team name tests (#738)
  - REFERER # the HTTP Referer header, as Plug and Honeybadger spell it
  - fnox # the secrets tool that holds the Fly tokens, in backups/backup.sh and docs/deployment.md
  - onsubmit # an HTML attribute
  - Dhillon # made-up member in style guide sample data
  - GSAR # Ground Search and Rescue, a qualification in style guide sample data
  - Squamish # the town of the made-up team in style guide sample data
  - Stawamus # a mountain near Squamish, in style guide sample data
  - Murrin # Murrin Park near Squamish, in style guide sample data
  - aria-describedby
  - aria-labelledby
  - bcsara # BC Search and Rescue Association, the first parent organization
  - nsara # a made-up association in organization tests (#512)
  - wsara # a made-up association in organization tests and mockups (#512)
  - behaviour
  - dedup
  - Ecto
  - esbuild
  - flyctl
  - gshaw # the GitHub account that owns the repo; LICENSE is plain text with nowhere for an inline ignore
  - heex
  - hexpm
  - httpc
  - httpoison
  - hspacer
  - libncurses
  - libstdc
  - pkpass # Apple Wallet's pass file extension
  - smime # the openssl subcommand that signs Apple Wallet passes
  - wwdr # Apple Worldwide Developer Relations, the intermediate certificate for passes
  - savetowallet # the JWT type of a Google Wallet save link
  - msgid
  - myclass
  - myhook
  - mylist
  - nocase
  - noreply
  - Oban
  - rsquo
  - sarduty
  - SARVAC
  - signup
  - SRVTC
  - strftime
  - tabular-nums
  - tbody
  - thead
  - totp
  - Tzdata
  - X
  - Zepto

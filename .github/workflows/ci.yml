name: CI

on:
  push:
    branches: [main]
  pull_request:

# same-tree reads the merged PR and its check runs.
permissions:
  contents: read
  pull-requests: read
  checks: read

jobs:
  checks:
    name: Checks and tests
    runs-on: ubuntu-24.04
    # A normal run takes about 5 minutes. Without this, a hang runs for 6 hours.
    timeout-minutes: 20

    env:
      # Fail fast instead of spending ten minutes compiling Erlang from source
      # if mise ever can't find a precompiled build for this runner.
      MISE_ERLANG_COMPILE: "false"
      # vix builds against the system libvips, as in the Dockerfile (#497).
      VIX_COMPILATION_MODE: PLATFORM_PROVIDED_LIBVIPS

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # A push to main whose tree matches its PR's green head was already tested.
      # Skip the steps, not the job, so "Checks and tests" still reports success.
      # Any doubt runs everything.
      - name: Skip if the PR's CI tested this tree
        id: same_tree
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if line=$(.github/scripts/same-tree "$GITHUB_SHA" "$GITHUB_REPOSITORY"); then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
          echo "$line" | tee -a "$GITHUB_STEP_SUMMARY"

      # Ubuntu's mirror sometimes crawls: libvips-dev is about 170 packages, and one
      # run spent 7 minutes on them while another hung. Retries and a timeout make a
      # slow mirror fail fast; the cache skips the mirror on every run after the first.
      - name: Make apt retry and time out
        if: steps.same_tree.outputs.skip != 'true'
        run: |
          echo 'Acquire::Retries "3";' | sudo tee /etc/apt/apt.conf.d/80-ci
          echo 'Acquire::http::Timeout "20";' | sudo tee -a /etc/apt/apt.conf.d/80-ci

      # A cold install from a slow mirror took 9 minutes on 2026-11-18. 15 lets it
      # finish and save the cache; a real hang still stops long before 6 hours.
      # mupdf-tools: mutool reads a form's page, as in the Dockerfile (#1083).
      - name: Install libvips and mutool
        if: steps.same_tree.outputs.skip != 'true'
        timeout-minutes: 15
        uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # v1.6.3
        with:
          packages: libvips-dev mupdf-tools
          version: "1"
          execute_install_scripts: true

      - name: Install mise
        if: steps.same_tree.outputs.skip != 'true'
        uses: jdx/mise-action@v4

      - name: Cache deps and _build
        if: steps.same_tree.outputs.skip != 'true'
        uses: actions/cache@v6
        with:
          path: |
            deps
            _build
          key: mix-${{ runner.os }}-${{ hashFiles('.mise.toml', 'mix.lock') }}
          restore-keys: mix-${{ runner.os }}-

      - name: Fetch deps
        if: steps.same_tree.outputs.skip != 'true'
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get

      # -c (--continue-on-error) runs every check even after one fails, so a
      # single red build shows all the problems at once. Run locally with
      # `mise run -c ci-static-analysis`.
      #
      # MISE_TASK_OUTPUT=interleave drops mise's per-task line prefix, which
      # would otherwise stop GitHub from reading annotation lines.
      - name: Run static analysis
        if: steps.same_tree.outputs.skip != 'true'
        env:
          MISE_TASK_OUTPUT: interleave
        run: mise run -c ci-static-analysis

      - name: Run tests
        if: steps.same_tree.outputs.skip != 'true'
        run: mise run test

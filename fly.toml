# fly.toml app configuration file generated for sarduty on 2023-12-02T18:46:18-08:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = "sarduty"
primary_region = "yyz"
kill_signal = "SIGTERM"
# Oban gives running jobs 15 s to finish at a deploy; Fly's default of 5 s cut them off.
kill_timeout = 20

[build]

[env]
DATABASE_PATH = "/mnt/sarduty/sarduty.db"
PHX_HOST = "sarduty.com"
PORT = "8080"
TEAM_LOGO_PATH = "/mnt/sarduty/team-logos"

[http_service]
internal_port = 8080
force_https = true
auto_stop_machines = "off"
auto_start_machines = true
min_machines_running = 1
processes = ["app"]
[http_service.concurrency]
type = "connections"
hard_limit = 1000
soft_limit = 1000

# Web.Health: 200 when the database answers (#106). Migrations run at boot, before the
# app listens, so the grace period covers them too. fly deploy waits for it to pass.
[[http_service.checks]]
method = "GET"
path = "/health"
interval = "15s"
timeout = "5s"
grace_period = "60s"

# Litestream's metrics (addr in litestream.yml), such as litestream_checkpoint_seconds (#416).
[metrics]
port = 9090
path = "/metrics"

[mounts]
source = "sarduty"
destination = "/mnt/sarduty"

[[vm]]
cpu_kind = "shared"
cpus = 1 # cspell:ignore cpus
memory_mb = 1024
